# Minima theme configuration
remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme
  - jekyll-github-metadata
  - jekyll-seo-tag
  - jekyll-coffeescript
  - jekyll-commonmark-ghpages
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-toc
  - jekyll-gfm-admonitions

# valid social icon names can be found at https://fontawesome.com/search?ic=brands

minima:
  skin: auto
  hide_site_feed_link: true
  show_excerpts: false
  social_links:
    - title: "@blwatkins/utils"
      icon: npm
      icon_pack: brands
      url: "https://www.npmjs.com/package/@blwatkins/utils"
    - title: "Source Code"
      icon: git-alt
      icon_pack: brands
      url: "https://github.com/blwatkins/typescript-utils"
    - title: "GitHub Pages"
      icon: square-github
      icon_pack: brands
      url: "https://blwatkins.github.io/"
    - title: GitHub
      icon: github
      icon_pack: brands
      url: "https://github.com/blwatkins"
    - title: YouTube
      icon: youtube
      icon_pack: brands
      url: "https://www.youtube.com/channel/UCeJ-huUU2AWP0z4-HWr1BXQ"
    - title: LinkedIn
      icon: linkedin
      icon_pack: brands
      url: "https://www.linkedin.com/in/brittni-watkins/"
  nav_pages:
    - index.md

title: "TypeScript Utilities"
description: "A toolkit of general-purpose TypeScript and JavaScript utilities."
show_downloads: true

sass:
  quiet_deps: true

exclude:
  - .ruby-version
  - Gemfile
  - Gemfile.lock
  - vendor
